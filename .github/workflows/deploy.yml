name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    # Run every Monday at 05:00 UTC to sync with ORCID API
    - cron: "0 5 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch publications from ORCID and generate site
        run: |
          python src/pubs.py

      - name: Run test suite
        run: |
          python -m unittest discover tests

      - name: Upload generated pages as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-pages
          path: |
            index.html
            publications.html
            people.html
            research.html
            code.html
            header.html
            footer.html
            _includes/
            publications.json
            PUBLICATIONS.md

      - name: Commit updated publications data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-update publications from ORCID [skip ci]"
          file_pattern: "data/authors.csv"
        continue-on-error: true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

