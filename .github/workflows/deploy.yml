name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run every Monday at 05:00 UTC to sync with ORCID API
    - cron: "0 5 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      # src/pubs.py falls back to this cache when the ORCID API is unreachable,
      # and refuses to write a partial bibliography otherwise. Without the cache
      # restored here, every run starts cold and a single transient API failure
      # would block the deploy.
      - name: Restore ORCID response cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: orcid-cache-${{ github.run_id }}
          restore-keys: |
            orcid-cache-

      - name: Fetch publications from ORCID
        run: |
          python -m src.pubs

      - name: Build website
        run: |
          python -m src.build_site

      - name: Run test suite
        run: |
          python -m unittest discover tests

      - name: Upload generated pages as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-pages
          path: |
            index.html
            publications.html
            people.html
            research.html
            code.html
            news.html
            publications.json
            PUBLICATIONS.md

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

