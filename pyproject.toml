[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddmms-site"
version = "0.1.0"
description = "Static site generator for the Data Driven Materials and Molecular Science (DDMMS) group website"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"

dependencies = [
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
]

# No console scripts: the generator reads data/ and writes HTML relative to the
# repository root, so it is run from a checkout with
#   python -m src.pubs        (fetch publications from ORCID)
#   python -m src.build_site  (generate the pages)
# Installing the project is how the pinned dependencies above get resolved.

[tool.setuptools]
packages = ["src", "src.components", "src.pages"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["build"]

[tool.ruff.lint]
# F401 unused imports, F841 unused locals, E7xx common mistakes
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These modules deliberately re-export names for callers and tests; the imports
# look unused locally but are part of the public surface (see each __all__).
"src/__init__.py" = ["F401"]
"src/build_site.py" = ["F401"]
"src/pubs.py" = ["F401"]
"src/components/__init__.py" = ["F401"]
"src/pages/__init__.py" = ["F401"]
# Tests import symbols to assert they exist and are importable, and must set up
# sys.path before importing the modules under test.
"tests/*" = ["F401", "E402"]
