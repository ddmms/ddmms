title: "Collaborate With Us"
intro: "We work with universities and national research networks on machine-learned interatomic potentials, high-throughput simulation workflows and open-source software such as janus-core and aiida-mlip. For PhD projects, STFC schemes and upcoming schools, see <a href=\"opportunities.html\">Opportunities</a>."

