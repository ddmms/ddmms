bio: |
  Junwen is the lead developer of [Goldilocks](https://goldilocks.ac.uk), which uses high-throughput DFT, machine learning and LLM-based AI agents to choose converged, cost-efficient settings for DFT calculations, so that less compute and electricity is wasted on national supercomputers such as ARCHER2.

  Goldilocks turns a crystal structure into recommended calculation settings, records the basis for each recommendation, and generates the input files and submission script needed to run it. It draws on machine-learning models and datasets published on PSDI, including converged k-point meshes for more than 17,000 structures. The tool runs as a command-line program, a browser application, an HTTP API and an MCP server for AI assistants; an LLM-based agent, in development, orchestrates scientific workflows and explains its recommendations in plain language. The k-point work is published in [Digital Discovery (2026)](https://doi.org/10.1039/d5dd00565e).

  Alongside Goldilocks, Junwen works on first-principles methods and their applications: electron–phonon coupling and phonon anharmonicity from DFT and DFPT, including carrier mobility in halide perovskites and the phonon-limited resistivity of metals; nonadiabatic coupling and excited-state dynamics in CP2K; and ferroelectric hafnia.
short_bio: "Computational scientist and lead developer of Goldilocks: high-throughput DFT, machine learning and LLM-based AI agents for converged, cost-efficient DFT settings. Also works on electron–phonon coupling, DFPT, perovskites and nonadiabatic dynamics in CP2K."
