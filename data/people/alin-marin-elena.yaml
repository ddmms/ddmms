bio: |
  Alin leads the Data Driven Materials and Molecular Science research group.

  Current work focuses on physics-informed machine learning (machine-learnt interatomic potentials), transport properties in complex liquids and molten salts, porous materials, and explaining experimental results via atomistic modelling.
short_bio: "Group Leader of DDMMS focusing on machine-learned interatomic potentials, complex liquids, porous materials, and multiscale materials modelling."
research_interests:
  - "Machine-learned interatomic potentials (MLIPs) and MACE foundation models"
  - "Rare event sampling, enhanced sampling, and free energy methods"
  - "Molecular dynamics algorithms and scalable parallel simulation software (DL_POLY)"
  - "Transport properties and thermodynamics in complex liquids and molten salts"
  - "Porous frameworks, metal-organic frameworks, and guest-host adsorption"
  - "Bridging experimental synchrotron/neutron observations with atomistic modelling"
