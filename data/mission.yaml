    - title: "MACE-MP: Foundation Model for Materials Chemistry"
      image: "assets/images/highlights/184110_1_5.0297006.figures.online.f3.jpg"
      image_position: "25% 35%"
      text_side: "right"
      image_alt: "MACE foundation model for atomistic materials chemistry (Batatia et al., JCP 2025)"
      description: "Our landmark foundation model for atomistic materials chemistry, trained on diverse inorganic and molecular systems across the periodic table. Published in The Journal of Chemical Physics (2025), MACE-MP delivers quantum-level accuracy with linear-scaling speed for extreme-scale molecular dynamics."
      links:
        - text: "Read Paper (JCP 2025)"
          url: "https://doi.org/10.1063/5.0297006"
        - text: "Explore Publications"
          url: "publications.html"
    - title: "ML-PEG: Machine Learning Performance and Extrapolation Guide"
      image: "assets/images/research/ml_peg.jpg"
      image_position: "50% 50%"
      text_side: "right"
      image_alt: "ML-PEG benchmarking framework and interactive dashboard"
      description: "Evaluating machine-learned interatomic potentials beyond basic training errors. ML-PEG establishes rigorous standardized community benchmarks to evaluate true physical stability, out-of-distribution extrapolation, and uncertainty quantification across materials discovery tasks."
      links:
        - text: "Visit ml-peg.stfc.ac.uk"
          url: "https://ml-peg.stfc.ac.uk"
        - text: "GitHub Repository"
          url: "https://github.com/ddmms/ml-peg"
    - title: "Project Goldilocks: AI-Driven DFT Automation"
      image: "assets/images/research/goldilocks.jpg"
      image_position: "50% 50%"
      text_side: "right"
      image_alt: "Project Goldilocks data-driven DFT automation platform"
      description: "Recommends converged, cost-efficient settings for DFT calculations from crystal structures, eliminating under-converged results and compute waste on national supercomputers. Developed with the PSDI Data to Knowledge initiative and published in RSC Digital Discovery."
      links:
