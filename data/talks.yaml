    event: "CECAM Workshop: A roadmap for an atomistic machine learning software ecosystem, EPFL, Lausanne, Switzerland"
    description: "Invited talk presented with James Kermode in the session on Infrastructure Developments. Covers ML-PEG, a modular framework to develop, run, and visualise automated, interactive test suites for machine-learned interatomic potentials."
