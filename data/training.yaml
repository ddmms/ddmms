        image_alt: "Participants at the CCP5 Summer School 2025 at Newcastle University"
        description: "Held at Newcastle University (20–31 July 2025), this annual two-week school offered in-depth training in condensed-matter molecular simulation, bridging theoretical statistical mechanics with hands-on computational workflows in molecular dynamics and Monte Carlo methods."
      - year: "2025"
        title: "The Atomic Simulation Environment Ecosystem: Present and Perspectives"
        role: "Co-Organiser: Alin Elena · Lecturer: Alin Elena"
        url: "https://ase-lib.org/events/2025-06-Lausanne-workshop/"
        image: "assets/images/ase_lausanne_2025.jpg"
        image_alt: "Participants at the Atomic Simulation Environment workshop at EPFL Lausanne"
        description: "A CECAM Flagship Workshop held at CECAM-HQ (EPFL, Lausanne, Switzerland, 23–27 June 2025) bringing together core developers and users of the Atomic Simulation Environment (ASE) and its broader ecosystem to transition towards a distributed plugin architecture, community governance, and sustainable interoperability."
      - year: "2025"
        title: "CaMML Spring School"
        role: "Co-Organiser: Alin Elena · Lecturer: Alin Elena"
        url: "https://spring2025.camml.ac.uk/about/"
        image: "assets/images/camml_spring_2025.webp"
        image_alt: "Participants at the CaMML Spring School 2025 at STFC Daresbury Laboratory"
        description: "Held at STFC Daresbury Laboratory (31 March – 4 April 2025), this five-day school organised by PSDI and AIchemy with support from STFC-SCD, PSDS, CCP5, and CCP9 introduced PhD researchers to machine learning methods, interatomic potentials, and graph neural networks for atomistic simulation."
      - year: "2024"
        title: "CCP5 Summer School"
        role: "Co-Organiser: Alin Elena · Lecturer: Alin Elena"
        url: "https://summer2024.ccp5.ac.uk"
        image: "assets/images/ccp5_2024.webp"
        image_alt: "Participants at the CCP5 Summer School 2024 at Newcastle University"
        description: "Organised by CCP5 and sponsored by CECAM at Newcastle University (14–25 July 2024), providing early-career researchers and PhD students with theoretical instruction, practical computational masterclasses, and seminars across state-of-the-art molecular simulation."
      - year: "2023"
        title: "Machine Learning for Atomistic Modelling Autumn School"
        role: "Co-Organiser: Alin Elena · Lecturer: Alin Elena"
        url: "https://www.psdi.ac.uk/event/machine-learning-autumn-school-2023/"
        description: "A three-day training school held at STFC Daresbury Laboratory (18–20 September 2023), organised by the PSDI initiative in collaboration with PSDS, AI4SD, STFC-SCD, and CCP5, introducing PhD researchers to machine learning principles and atomistic modeling techniques."
      - year: "2023"
