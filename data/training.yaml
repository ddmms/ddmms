        description: "A five-day hands-on course at STFC Daresbury Laboratory (13–17 April 2026), organised by PSDI and AIchemy with support from STFC-SCD, PSDS, CCP5, and CCP9, covering the fundamentals of machine learning, neural network interatomic potentials, and graph neural networks for materials."
      - year: "2025"
        title: "CCP5 Summer School"
        role: "Co-Organiser: Alin Elena · Lecturer: Alin Elena"
        url: "https://summer2025.ccp5.ac.uk"
