subtitle: "Our team comprises specialists in theoretical condensed matter physics, computational chemistry, software architecture, and AI for science."

sections:
  - id: "core-team"
    nav_title: "Core Team"
    title: "Core Members"
    subtitle: "Researchers and computational scientists."
    members:
      - name: "Dr. Alin Marin Elena"
        avatar: "assets/images/alin_elena.jpg"
        role: "Group Leader &bull; Principal Computational Scientist"
        affiliation: "STFC SCD, UKRI | CCP5 Scientific Secretary"
        bio: "Alin leads the Data Driven Materials and Molecular Science research group. His work centres on multiscale molecular dynamics algorithms, the architecture and scalable parallelisation of DL_POLY 5, physics-informed machine learning, and transport properties in complex liquids and molten salts."
        tags:
          - "ML Interatomic Potentials"
          - "MACE Foundation Models"
          - "Rare Event Sampling"
          - "Molecular Dynamics"
          - "Molten Salts"
          - "Porous Materials"
          - "High Performance Computing"
        links:
          - text: "ORCID"
            url: "https://orcid.org/0000-0002-7013-6670"
            icon: "orcid"
          - text: "GitHub"
            url: "https://github.com/alinelena"
          - text: "Publications"
            url: "publications.html?author=Alin%20Marin%20Elena"

      - name: "Elliott Kasoar"
        avatar: "assets/images/elliott_kasoar.jpg"
        role: "Computational Scientist &bull; Research Associate"
        affiliation: "STFC SCD, UKRI"
        bio: "Elliott focuses on machine learning for atomic systems, equivariant foundation architectures (MACE), training set active learning, and automated atomistic simulation workflows. He is the lead designer and developer of janus-core."
        tags:
          - "MACE Foundation Models"
          - "janus-core Lead"
          - "Workflow Automation"
        links:
          - text: "ORCID"
            url: "https://orcid.org/0009-0005-2015-9478"
            icon: "orcid"
          - text: "Publications"
            url: "publications.html?author=Elliott%20Kasoar"

      - name: "Dr. Junwen Yin"
        avatar: "assets/images/junwen_yin.jpeg"
        role: "Computational Scientist &bull; Research Associate"
        affiliation: "STFC SCD, UKRI"
        bio: "Junwen specializes in first-principles quantum chemistry, nonadiabatic electronic transitions, extended CP2K simulations, and modeling complex catalytic and photoactive interfaces under operational environments."
        tags:
          - "Nonadiabatic Dynamics"
          - "CP2K Framework"
          - "DFT Total Energy"
          - "Catalytic Interfaces"
        links:
          - text: "ORCID"
            url: "https://orcid.org/0000-0001-7374-9352"
            icon: "orcid"
          - text: "Publications"
            url: "publications.html?author=Junwen%20Yin"

