  - id: "graduate-scheme"
    title: "STFC Graduate Scheme"
    description: "STFC's graduate programme is a permanent role in a department, with a two-year core training programme alongside technical training, mentoring towards professional registration, and a three-month placement in another STFC department. Computing is one of its five pathways. Applicants need, or are on course for, at least a 2:1 in a relevant subject."
    links:
      - text: "STFC Graduate Programme"
        url: "https://stfccareers.co.uk/graduates/"

  - id: "placements"
    title: "STFC Industrial and Summer Placements"
    description: "Undergraduates can work alongside STFC scientists and engineers on a year-long industrial placement during their degree, or on a summer placement. Both are aligned with the STFC graduate programme."
    links:
      - text: "STFC Industrial and Summer Placements"
        url: "https://stfccareers.co.uk/students/"
