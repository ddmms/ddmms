  - id: "phd"
    title: "PhD Programme"
    description: "PhD projects co-supervised by DDMMS members with partner universities."
    projects:
      - title: "Properties of Functional Oxides – Using machine learning and atomistic simulations to improve AI technologies"
        url: "https://www.ucl.ac.uk/mathematical-physical-sciences/data-intensive-science-and-industry/study-here/available-phd-projects/projects-mssl-space-science-computational-physical-sciences"
        status: "In progress"
